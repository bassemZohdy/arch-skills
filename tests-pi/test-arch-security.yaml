# Pi Harness: Security Architecture
harness: pi
model: claude-haiku-4-5-20251001
timeout: 180
skill: ./skills/arch-security

scenarios:
  - name: "performs threat modeling"
    steps:
      - prompt: "Perform a threat model for a user authentication system using STRIDE."
        assert:
          - type: contains
            value: "STRIDE"
          - type: contains
            value: "Spoofing"
          - type: contains
            value: "Tampering"
          - type: not_contains
            value: "plain text password"

  - name: "assesses risk with DREAD"
    steps:
      - prompt: "Assess the risk of SQL injection vulnerability using DREAD."
        assert:
          - type: contains
            value: "DREAD"
          - type: contains
            value: "Damage"
          - type: not_contains
            value: "ignore it"

  - name: "checks OWASP Top 10"
    steps:
      - prompt: "Check this API against OWASP Top 10 vulnerabilities."
        assert:
          - type: contains
            value: "OWASP"
          - type: not_contains
            value: "disable TLS"

  - name: "recommends security patterns"
    runs: 3
    min_pass_rate: 0.67
    steps:
      - prompt: "What authentication pattern should I use for a mobile app?"
        assert:
          - type: contains
            value: "OAuth"
          - type: contains
            value: "JWT"
          - type: not_contains
            value: "Basic auth without TLS"
