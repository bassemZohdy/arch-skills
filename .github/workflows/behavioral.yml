name: Optional model response tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: behavioral-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCH_TEST_API_BASE: ${{ vars.ARCH_TEST_API_BASE }}
      ARCH_TEST_MODEL: ${{ vars.ARCH_TEST_MODEL }}
      ARCH_TEST_API_KEY: ${{ secrets.ARCH_TEST_API_KEY }}
      ARCH_TEST_MAX_TOKENS: '2048'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build isolated skill packages
        run: python scripts/build_packages.py --profile expert --output .cache/behavioral-packages
      - name: Run 16 bounded model calls (unavailable is not a pass)
        run: >-
          python scripts/behavioral.py run
          --manifest tests/test-regression.yaml
          --manifest tests/test-arch-evaluate.yaml
          --packages .cache/behavioral-packages
          --output .cache/behavioral-results
          --limit 0 --max-calls 16
      - name: Retain transcripts and assertion results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behavioral-smoke
          path: .cache/behavioral-results
          if-no-files-found: error
          retention-days: 14
