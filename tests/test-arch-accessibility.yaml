timeout: 180
skill: ./skills/arch-accessibility

scenarios:
  - name: "checks WCAG compliance"
    steps:
      - prompt: "Check this web application for WCAG 2.1 AA compliance."
        assert:
          - type: contains_any
            value: ["success criteri", "perceivable", "operable", "understandable"]
          - type: contains_any
            value: ["screen reader", "assistive", "manual"]

  - name: "implements ARIA patterns"
    steps:
      - prompt: "How do I implement ARIA labels for screen reader accessibility?"
        assert:
          - type: contains_any
            value: ["native", "semantic HTML", "role"]
          - type: contains
            value: "aria-label"

  - name: "validates color contrast"
    steps:
      - prompt: "What are the minimum color contrast ratios for WCAG AA compliance?"
        assert:
          - type: contains_any
            value: ["3:1", "large text", "non-text"]
          - type: contains
            value: "4.5:1"

  - name: "tests keyboard navigation"
    steps:
      - prompt: "How do I test keyboard navigation accessibility?"
        assert:
          - type: contains_any
            value: ["tab order", "keyboard trap", "focus indicator", "Shift+Tab"]
          - type: contains
            value: "focus"

  - name: "creates accessibility statement"
    steps:
      - prompt: "Create an accessibility statement for a web application."
        assert:
          - type: contains_any
            value: ["conformance", "known limitations", "feedback", "contact"]
          - type: contains_any
            value: ["WCAG", "EN 301 549", "Section 508"]
