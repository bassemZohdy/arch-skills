timeout: 180
skill: ./skills/arch-ddd

scenarios:
  - name: "identifies bounded contexts"
    steps:
      - prompt: "Identify bounded contexts for an e-commerce platform with users, products, orders, and shipping."
        assert:
          - type: contains_any
            value: ["ubiquitous language", "context map", "anti-corruption", "shared kernel"]
          - type: contains
            value: "domain"

  - name: "designs aggregates"
    steps:
      - prompt: "Design aggregates for an order management domain."
        assert:
          - type: contains_any
            value: ["root", "consistency boundary", "transaction", "reference by id", "identity"]
          - type: contains
            value: "invariant"
          - type: not_contains
            value: "one giant aggregate"

  - name: "creates context map"
    steps:
      - prompt: "Create a context map showing relationships between Sales, Shipping, and Finance contexts."
        assert:
          - type: contains_any
            value: ["upstream", "downstream", "Customer-Supplier", "Conformist", "Anti-Corruption"]
          - type: contains_any
            value: ["Shared Kernel", "Published Language", "Open Host", "Partnership"]
          - type: not_contains
            value: "no dependencies"

  - name: "applies tactical patterns"
    steps:
      - prompt: "When should I use a Value Object instead of an Entity in DDD?"
        assert:
          - type: contains_any
            value: ["identity", "equality", "compared by"]
          - type: contains
            value: "immutable"

  - name: "refactors to DDD"
    steps:
      - prompt: "How do I refactor an anemic domain model to a rich domain model?"
        assert:
          - type: contains_any
            value: ["invariant", "behavior", "encapsulat"]
          - type: contains_any
            value: ["move logic", "Move Method", "entity", "aggregate"]

  - name: "explains context mapping patterns"
    steps:
      - prompt: "Explain the difference between Customer-Supplier and Anti-Corruption Layer patterns in DDD context mapping."
        assert:
          - type: contains_any
            value: ["upstream", "downstream"]
          - type: contains_any
            value: ["translat", "isolat", "legacy", "adapter"]
          - type: not_contains
            value: "same thing"

  - name: "facilitates Event Storming"
    runs: 3
    min_passes: 2
    steps:
      - prompt: "Walk me through the steps of running an Event Storming workshop for a new insurance claims system."
        assert:
          - type: contains_any
            value: ["orange", "sticky", "command", "policy", "hotspot"]
          - type: contains
            value: "domain event"
          - type: not_contains
            value: "skip the modeling"

  - name: "identifies DDD smells"
    steps:
      - prompt: "What DDD smells should I look for in a codebase that claims to follow domain-driven design?"
        assert:
          - type: contains
            value: "anemic"
          - type: contains
            value: "god aggregate"
          - type: not_contains
            value: "no smells found"
