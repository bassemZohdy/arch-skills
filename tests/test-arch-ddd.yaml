harness: claude-code
model: claude-haiku-4-5-20251001
timeout: 180
skill: ./skills/arch-ddd

scenarios:
  - name: "identifies bounded contexts"
    steps:
      - prompt: "Identify bounded contexts for an e-commerce platform with users, products, orders, and shipping."
        assert:
          - type: contains
            value: "bounded context"
          - type: contains
            value: "domain"

  - name: "designs aggregates"
    steps:
      - prompt: "Design aggregates for an order management domain."
        assert:
          - type: contains
            value: "aggregate"
          - type: contains
            value: "invariant"
          - type: not_contains
            value: "one giant aggregate"

  - name: "creates context map"
    steps:
      - prompt: "Create a context map showing relationships between Sales, Shipping, and Finance contexts."
        assert:
          - type: contains
            value: "context map"
          - type: contains
            value: "relationship"
          - type: not_contains
            value: "no dependencies"

  - name: "applies tactical patterns"
    steps:
      - prompt: "When should I use a Value Object instead of an Entity in DDD?"
        assert:
          - type: contains
            value: "Value Object"
          - type: contains
            value: "immutable"

  - name: "refactors to DDD"
    steps:
      - prompt: "How do I refactor an anemic domain model to a rich domain model?"
        assert:
          - type: contains
            value: "anemic"
          - type: contains
            value: "rich"

  - name: "explains context mapping patterns"
    steps:
      - prompt: "Explain the difference between Customer-Supplier and Anti-Corruption Layer patterns in DDD context mapping."
        assert:
          - type: contains
            value: "Customer-Supplier"
          - type: contains
            value: "Anti-Corruption Layer"
          - type: not_contains
            value: "same thing"

  - name: "facilitates Event Storming"
    runs: 3
    min_pass_rate: 0.67
    steps:
      - prompt: "Walk me through the steps of running an Event Storming workshop for a new insurance claims system."
        assert:
          - type: contains
            value: "Event Storming"
          - type: contains
            value: "domain event"
          - type: not_contains
            value: "skip the modeling"

  - name: "identifies DDD smells"
    steps:
      - prompt: "What DDD smells should I look for in a codebase that claims to follow domain-driven design?"
        assert:
          - type: contains
            value: "anemic"
          - type: contains
            value: "god aggregate"
          - type: not_contains
            value: "no smells found"
