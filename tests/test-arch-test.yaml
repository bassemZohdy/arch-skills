timeout: 180
skill: ./skills/arch-test

scenarios:
  - name: "designs test pyramid"
    steps:
      - prompt: "Design a test pyramid for a microservices architecture."
        assert:
          - type: contains_any
            value: ["integration", "end-to-end", "E2E", "contract"]
          - type: contains
            value: "unit"

  - name: "implements contract testing"
    steps:
      - prompt: "How do I implement contract testing between services?"
        assert:
          - type: contains_any
            value: ["consumer", "provider", "broker"]
          - type: contains
            value: "Pact"

  - name: "creates test strategy"
    steps:
      - prompt: "Create a test strategy for a new feature with API, database, and UI components."
        assert:
          - type: contains_any
            value: ["unit", "integration", "end-to-end", "E2E"]
          - type: contains
            value: "coverage"

  - name: "defines quality gates"
    steps:
      - prompt: "What quality gates should I set for my CI/CD pipeline?"
        assert:
          - type: contains_any
            value: ["fail", "block", "threshold", "mutation"]
          - type: contains
            value: "coverage"

  - name: "designs E2E tests"
    steps:
      - prompt: "How should I design end-to-end tests for critical user flows?"
        assert:
          - type: contains
            value: "E2E"
          - type: contains
            value: "critical path"
