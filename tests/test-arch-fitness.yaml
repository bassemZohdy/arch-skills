timeout: 180
skill: ./skills/arch-fitness

scenarios:
  - name: "explains fitness functions"
    steps:
      - prompt: "What are architecture fitness functions and how do they work?"
        assert:
          - type: contains_any
            value: ["Evolutionary Architectures", "Ford", "atomic", "holistic", "objective"]
          - type: contains
            value: "automated"
          - type: contains
            value: "architectural"
          - type: not_contains
            value: "manual review only"

  - name: "creates ArchUnit test"
    runs: 3
    min_passes: 2
    steps:
      - prompt: "Create an ArchUnit test to enforce that service layer does not depend on infrastructure layer in a Java project."
        assert:
          - type: contains_any
            value: ["@Test", "@ArchTest", "importClasses", "ClassFileImporter"]
          - type: contains
            value: "dependOnClassesThat"
          - type: capability_used
            value: "file_write"
          - type: contains
            value: "noClasses"
          - type: contains
            value: "resideInAPackage"

  - name: "creates dependency rule"
    steps:
      - prompt: "Write a fitness function to ensure controllers only depend on services, not directly on repositories."
        assert:
          - type: contains
            value: "dependency"
          - type: contains_any
            value: ["..controller..", "resideInAPackage", "dependOnClassesThat", "forbidden"]
          - type: contains_any
            value: ["noClasses", "onlyDependOn", "layered", "Layer"]
          - type: contains
            value: "repository"

  - name: "CI/CD integration"
    steps:
      - prompt: "Show me how to integrate architecture fitness functions into a GitHub Actions CI/CD pipeline."
        assert:
          - type: contains_any
            value: ["workflow", ".github/workflows", "on: [push"]
          - type: contains_any
            value: ["runs-on", "steps:", "uses:"]
          - type: contains_any
            value: ["fail the build", "exit code", "gate", "merge"]

  - name: "performance fitness function"
    steps:
      - prompt: "Create a fitness function to ensure API response times stay under 200ms."
        assert:
          - type: contains
            value: "performance"
          - type: contains_any
            value: ["p95", "p99", "percentile"]
          - type: contains_any
            value: ["warm-up", "load", "benchmark", "sample"]

  - name: "creates ArchUnitTS test"
    steps:
      - prompt: "Create an ArchUnitTS test to enforce layer dependencies in a TypeScript project."
        assert:
          - type: contains_any
            value: ["projectFiles", "inFolder", "dependOn", "shouldNot"]
          - type: contains
            value: "describe"
          - type: contains
            value: "expect"

  - name: "creates quality gate configuration"
    steps:
      - prompt: "Create a quality gate configuration for architecture compliance."
        assert:
          - type: contains_any
            value: ["coverage", "vulnerabilit", "fail", "block"]
          - type: contains
            value: "threshold"

  - name: "creates naming convention rule"
    steps:
      - prompt: "Create a fitness function to enforce naming conventions for controllers."
        assert:
          - type: contains_any
            value: ["haveSimpleNameEndingWith", "suffix", "regex", "ending"]
          - type: contains_any
            value: ["resideInAPackage", "..controller..", "class"]

  - name: "creates module structure rule"
    steps:
      - prompt: "Create a fitness function to ensure no cyclic dependencies between modules."
        assert:
          - type: contains_any
            value: ["slices()", "beFreeOfCycles", "beFreeOfCyclicDependencies", "circular", "acyclic"]
          - type: contains_any
            value: ["package", "slice", "boundary"]

  - name: "automates security scanning"
    steps:
      - prompt: "How do I automate security scanning in my CI/CD pipeline?"
        assert:
          - type: contains_any
            value: ["SAST", "dependency", "SBOM", "Trivy", "Snyk"]
          - type: contains_any
            value: ["fail the build", "severity", "critical", "high"]
