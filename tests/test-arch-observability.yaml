timeout: 180
skill: ./skills/arch-observability

scenarios:
  - name: "designs logging strategy"
    steps:
      - prompt: "Design a structured logging strategy for microservices."
        assert:
          - type: contains_any
            value: ["trace ID", "traceId", "correlation", "level"]
          - type: contains
            value: "JSON"

  - name: "implements distributed tracing"
    steps:
      - prompt: "How do I implement distributed tracing across services?"
        assert:
          - type: contains
            value: "trace"
          - type: contains
            value: "OpenTelemetry"

  - name: "creates monitoring dashboard"
    steps:
      - prompt: "Create a monitoring dashboard using the RED method."
        assert:
          - type: contains_any
            value: ["Errors", "Duration", "requests per second"]
          - type: contains
            value: "latency"

  - name: "defines alerting rules"
    steps:
      - prompt: "What alerting rules should I set for a payment service?"
        assert:
          - type: contains_any
            value: ["SLO", "burn rate", "error budget", "runbook"]
          - type: contains
            value: "error rate"

  - name: "designs observability stack"
    steps:
      - prompt: "Design an observability stack with logs, metrics, and traces."
        assert:
          - type: contains_any
            value: ["OpenTelemetry", "collector", "OTLP"]
          - type: contains_any
            value: ["Prometheus", "Grafana", "Loki", "Jaeger", "Tempo"]
          - type: contains_any
            value: ["correlation", "trace ID", "span"]

  - name: "creates monitoring automation"
    steps:
      - prompt: "How do I automate monitoring and alerting for my applications?"
        assert:
          - type: contains_any
            value: ["Prometheus", "as code", "Terraform", "rules"]
          - type: contains_any
            value: ["runbook", "on-call", "SLO", "escalation"]
