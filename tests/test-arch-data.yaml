timeout: 180
skill: ./skills/arch-data

scenarios:
  - name: "selects database type"
    steps:
      - prompt: "I need to store user profiles, order transactions, and product catalog. What database types should I use for each?"
        assert:
          - type: contains
            value: "relational"
          - type: contains
            value: "NoSQL"

  - name: "designs data model"
    steps:
      - prompt: "Design a relational data model for an e-commerce system with customers, orders, products, and inventory."
        assert:
          - type: contains
            value: "entity"
          - type: contains
            value: "relationship"

  - name: "designs dimensional model"
    steps:
      - prompt: "Design a dimensional model for a sales analytics data warehouse with facts and dimensions."
        assert:
          - type: contains
            value: "fact"
          - type: contains
            value: "dimension"

  - name: "chooses data pipeline"
    steps:
      - prompt: "Should I use ETL or ELT for loading data into Snowflake from multiple sources?"
        assert:
          - type: contains
            value: "ELT"
          - type: not_contains
            value: "do it manually"

  - name: "defines data governance"
    steps:
      - prompt: "Define data quality dimensions and classification levels for a healthcare data platform."
        assert:
          - type: contains
            value: "accuracy"
          - type: contains
            value: "classification"

  - name: "designs data lineage"
    steps:
      - prompt: "How do I track data lineage from source systems to the analytics dashboard?"
        assert:
          - type: contains
            value: "lineage"
          - type: contains
            value: "source"

  - name: "designs streaming pipeline"
    steps:
      - prompt: "Design a streaming data pipeline for real-time clickstream analytics."
        assert:
          - type: contains
            value: "stream"
          - type: contains
            value: "real-time"

  - name: "classifies data sensitivity"
    runs: 3
    min_pass_rate: 0.67
    steps:
      - prompt: "Classify the following data: customer names, credit card numbers, product descriptions, internal wiki pages."
        assert:
          - type: contains
            value: "restricted"
          - type: contains
            value: "confidential"
          - type: not_contains
            value: "all public"
