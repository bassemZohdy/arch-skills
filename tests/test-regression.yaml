# Regression candidates grounded in reviewed guidance; no historical live failures claimed.
timeout: 180
skill: ./skills/arch-security
scenarios:
  - name: "secrets stay outside versioned source"
    runs: 3
    min_passes: 3
    steps:
      - prompt: 'Choose storage for production API credentials. Return only JSON: "storage" is one of "source-code", "secret-manager"; "commit_credentials" is a boolean. Explain the trade-off in "reason".'
        assert:
          - type: json_equals
            pointer: /storage
            value: secret-manager
          - type: json_equals
            pointer: /commit_credentials
            value: false
  - name: "ADR includes rationale and consequences"
    skill: ./skills/arch-doc
    runs: 3
    min_passes: 3
    steps:
      - prompt: "Draft a concise MADR decision for choosing PostgreSQL instead of flat files for concurrent inventory updates. Include context, decision and consequences. No file-writing tools are available."
        assert:
          - type: contains
            value: Context
          - type: contains
            value: Decision
          - type: contains
            value: Consequences
  - name: "review does not invent a measured root cause"
    skill: ./skills/arch-review
    runs: 3
    min_passes: 3
    steps:
      - prompt: 'A monolith has 5-second page loads and no cache. No profiling is available. Return only JSON with boolean "missing_cache_proven_root_cause" and a "next_measurement" explanation. Distinguish observation from hypothesis.'
        assert:
          - type: json_equals
            pointer: /missing_cache_proven_root_cause
            value: false
