timeout: 180
skill: ./skills/arch-security

scenarios:
  - name: "performs threat modeling"
    steps:
      - prompt: "Perform a threat model for a user authentication system using STRIDE."
        assert:
          - type: contains_any
            value: ["Repudiation", "Information Disclosure", "Denial of Service", "Elevation"]
          - type: contains
            value: "Spoofing"
          - type: contains
            value: "Tampering"
          - type: not_contains
            value: "plain text password"
          - type: not_contains
            value: "hardcode the secret"

  - name: "assesses risk with DREAD"
    steps:
      - prompt: "Assess the risk of SQL injection vulnerability using DREAD."
        assert:
          - type: contains_any
            value: ["Reproducibility", "Exploitability", "Affected", "Discoverability"]
          - type: contains
            value: "Damage"
          - type: not_contains
            value: "ignore it"

  - name: "checks OWASP Top 10"
    steps:
      - prompt: "Check this API against OWASP Top 10 vulnerabilities."
        assert:
          - type: contains_any
            value: ["Broken Access Control", "Injection", "Misconfiguration", "A01"]
          - type: not_contains
            value: "disable TLS"

  - name: "recommends security patterns"
    steps:
      - prompt: "What authentication pattern should I use for a mobile app? Explain OAuth authorization versus OpenID Connect identity."
        assert:
          - type: contains_any
            value: ["PKCE", "authorization code", "refresh token"]
          - type: contains_any
            value: ["ID token", "id_token", "identity layer", "OIDC"]
          - type: not_contains
            value: "Basic auth without TLS"

  - name: "reviews compliance requirements"
    steps:
      - prompt: "What are the GDPR requirements for handling user data?"
        assert:
          - type: contains_any
            value: ["lawful basis", "legal basis", "consent", "Article"]
          - type: contains_any
            value: ["erasure", "right to", "minimization", "DPIA"]

  - name: "designs data protection controls"
    runs: 3
    min_passes: 2
    steps:
      - prompt: "Design data protection controls for a system storing PII. Cover encryption at rest and in transit."
        assert:
          - type: contains_any
            value: ["AES", "KMS", "HSM", "key management", "key rotation"]
          - type: contains
            value: "TLS"
          - type: not_contains
            value: "store passwords in plaintext"

  - name: "recommends authorization model"
    steps:
      - prompt: "What authorization model should I use for a multi-tenant SaaS with role-based access?"
        assert:
          - type: contains
            value: "RBAC"
          - type: not_contains
            value: "give everyone admin"

  - name: "skips irrelevant compliance when not applicable"
    steps:
      - prompt: 'An internal tool processes no health information and has no covered-entity or business-associate role. Does HIPAA apply solely because it is an internal tool? Return only JSON with boolean "hipaa_required_on_these_facts".'
        assert:
          - type: json_equals
            pointer: /hipaa_required_on_these_facts
            value: false

  - name: "plans post-quantum cryptographic agility"
    steps:
      - prompt: "We store medical records that must stay confidential for 25 years and sign firmware with RSA-2048. How should the architecture prepare for quantum-capable attackers?"
        assert:
          - type: contains_any
            value: ["inventory", "agility", "agile"]
          - type: contains_any
            value: ["ML-KEM", "ML-DSA", "FIPS 203", "FIPS 204", "post-quantum", "PQC"]
          - type: contains_any
            value: ["harvest", "long-lived", "lifetime", "retention"]
          - type: contains_any
            value: ["hybrid", "configurable", "migration"]
