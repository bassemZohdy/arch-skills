timeout: 180
skill: ./skills/arch-security

scenarios:
  - name: "performs threat modeling"
    steps:
      - prompt: "Perform a threat model for a user authentication system using STRIDE."
        assert:
          - type: contains
            value: "STRIDE"
          - type: contains
            value: "Spoofing"
          - type: contains
            value: "Tampering"
          - type: not_contains
            value: "plain text password"
          - type: not_contains
            value: "hardcode the secret"

  - name: "assesses risk with DREAD"
    steps:
      - prompt: "Assess the risk of SQL injection vulnerability using DREAD."
        assert:
          - type: contains
            value: "DREAD"
          - type: contains
            value: "Damage"
          - type: not_contains
            value: "ignore it"

  - name: "checks OWASP Top 10"
    steps:
      - prompt: "Check this API against OWASP Top 10 vulnerabilities."
        assert:
          - type: contains
            value: "OWASP"
          - type: not_contains
            value: "disable TLS"

  - name: "recommends security patterns"
    steps:
      - prompt: "What authentication pattern should I use for a mobile app?"
        assert:
          - type: contains
            value: "OAuth"
          - type: contains
            value: "JWT"
          - type: not_contains
            value: "Basic auth without TLS"

  - name: "reviews compliance requirements"
    steps:
      - prompt: "What are the GDPR requirements for handling user data?"
        assert:
          - type: contains
            value: "GDPR"
          - type: contains
            value: "data"

  - name: "designs data protection controls"
    runs: 3
    min_pass_rate: 0.67
    steps:
      - prompt: "Design data protection controls for a system storing PII. Cover encryption at rest and in transit."
        assert:
          - type: contains
            value: "encryption"
          - type: contains
            value: "TLS"
          - type: not_contains
            value: "store passwords in plaintext"

  - name: "recommends authorization model"
    steps:
      - prompt: "What authorization model should I use for a multi-tenant SaaS with role-based access?"
        assert:
          - type: contains
            value: "RBAC"
          - type: not_contains
            value: "give everyone admin"

  - name: "skips irrelevant compliance when not applicable"
    steps:
      - prompt: "I'm building an internal tool with no user data. Do I need HIPAA compliance?"
        assert:
          - type: not_contains
            value: "HIPAA"
