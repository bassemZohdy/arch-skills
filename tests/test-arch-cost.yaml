timeout: 180
skill: ./skills/arch-cost

scenarios:
  - name: "implements FinOps framework"
    steps:
      - prompt: "How do I implement a FinOps framework for our cloud infrastructure?"
        assert:
          - type: contains_any
            value: ["Inform, Optimize", "Inform/Optimize", "Operate phase", "unit economics", "allocation"]
          - type: contains_any
            value: ["tag", "showback", "chargeback", "accountab"]

  - name: "optimizes cloud costs"
    steps:
      - prompt: "What strategies can I use to optimize AWS costs?"
        assert:
          - type: contains_any
            value: ["right-siz", "rightsiz", "Savings Plan", "Reserved", "Spot"]
          - type: contains_any
            value: ["idle", "utilization", "egress", "commitment"]

  - name: "creates cost allocation"
    steps:
      - prompt: "How do I create cost allocation tags for our cloud resources?"
        assert:
          - type: contains_any
            value: ["cost center", "owner", "environment", "team"]
          - type: contains_any
            value: ["enforce", "policy", "untagged", "Infrastructure as Code", "IaC"]

  - name: "sets up budget alerts"
    steps:
      - prompt: "How do I set up budget alerts for our cloud spending?"
        assert:
          - type: contains_any
            value: ["threshold", "forecast", "anomaly"]
          - type: contains_any
            value: ["owner", "notification", "escalat", "action"]

  - name: "measures unit economics"
    steps:
      - prompt: "How do I measure cost per user for our cloud services?"
        assert:
          - type: contains_any
            value: ["active user", "transaction", "denominator", "allocation"]
          - type: contains
            value: "unit economics"
