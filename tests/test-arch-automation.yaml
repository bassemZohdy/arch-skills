harness: claude-code
model: claude-haiku-4-5-20251001
timeout: 180
skill: ./skills/arch-automation

scenarios:
  - name: "creates CI/CD pipeline"
    steps:
      - prompt: "Create a CI/CD pipeline for a Python application with testing and deployment."
        assert:
          - type: contains
            value: "CI/CD"
          - type: contains
            value: "pipeline"

  - name: "automates documentation"
    steps:
      - prompt: "How do I automate API documentation generation from code?"
        assert:
          - type: contains
            value: "documentation"
          - type: contains
            value: "automation"

  - name: "implements infrastructure as code"
    steps:
      - prompt: "How do I implement infrastructure as code with Terraform?"
        assert:
          - type: contains
            value: "infrastructure"
          - type: contains
            value: "Terraform"

  - name: "automates security scanning"
    steps:
      - prompt: "How do I automate security scanning in my CI/CD pipeline?"
        assert:
          - type: contains
            value: "security"
          - type: contains
            value: "scanning"

  - name: "creates monitoring automation"
    steps:
      - prompt: "How do I automate monitoring and alerting for my applications?"
        assert:
          - type: contains
            value: "monitoring"
          - type: contains
            value: "alerting"
