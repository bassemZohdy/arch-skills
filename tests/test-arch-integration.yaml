timeout: 180
skill: ./skills/arch-integration

scenarios:
  - name: "designs API gateway"
    steps:
      - prompt: "Design an API gateway for a microservices architecture."
        assert:
          - type: contains_any
            value: ["routing", "rate limit", "authentication"]
          - type: contains_any
            value: ["BFF", "backend for frontend", "per domain", "single entry"]

  - name: "implements service mesh"
    steps:
      - prompt: "How do I implement a service mesh with Istio for my Kubernetes cluster?"
        assert:
          - type: contains_any
            value: ["sidecar", "ambient", "Envoy", "data plane"]
          - type: contains_any
            value: ["mTLS", "VirtualService", "DestinationRule", "Gateway"]

  - name: "creates integration pattern"
    steps:
      - prompt: "What integration pattern should I use for synchronous communication between services?"
        assert:
          - type: contains_any
            value: ["request/reply", "request-reply", "REST", "gRPC"]
          - type: contains_any
            value: ["timeout", "circuit breaker", "retry", "deadline"]

  - name: "designs ESB integration"
    steps:
      - prompt: "How do I design an Enterprise Service Bus for legacy system integration?"
        assert:
          - type: contains
            value: "ESB"
          - type: contains_any
            value: ["adapter", "transformation", "translator", "canonical"]

  - name: "implements circuit breaker"
    steps:
      - prompt: "Implement a circuit breaker pattern for service integration."
        assert:
          - type: contains_any
            value: ["half-open", "half open", "HALF_OPEN", "trip"]
          - type: contains
            value: "threshold"
