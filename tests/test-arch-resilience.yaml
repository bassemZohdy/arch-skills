timeout: 180
skill: ./skills/arch-resilience

scenarios:
  - name: "implements circuit breaker"
    steps:
      - prompt: "Implement a circuit breaker pattern for calling a payment service."
        assert:
          - type: contains_any
            value: ["half-open", "open state", "trip", "fallback"]
          - type: contains
            value: "threshold"

  - name: "designs retry policy"
    steps:
      - prompt: "Design a retry policy with exponential backoff for transient failures."
        assert:
          - type: contains_any
            value: ["jitter", "max attempts", "budget", "idempoten"]
          - type: contains_any
            value: ["multiplier", "base delay", "cap", "max delay"]

  - name: "implements bulkhead"
    steps:
      - prompt: "Implement bulkhead isolation for multiple downstream services."
        assert:
          - type: contains_any
            value: ["pool", "semaphore", "thread", "concurrent"]
          - type: contains_any
            value: ["blast radius", "exhaust", "partition", "degrad"]

  - name: "creates fallback strategy"
    steps:
      - prompt: "Design a fallback strategy when a recommendation service is unavailable."
        assert:
          - type: contains_any
            value: ["cache", "default", "stale", "popular"]
          - type: contains
            value: "degraded"

  - name: "plans chaos engineering"
    steps:
      - prompt: "How do I run chaos engineering experiments on my distributed system?"
        assert:
          - type: contains_any
            value: ["steady state", "hypothesis", "blast radius"]
          - type: contains_any
            value: ["abort", "rollback", "game day", "inject"]
