timeout: 180
skill: ./skills/arch-usability

scenarios:
  - name: "applies Nielsen heuristics"
    steps:
      - prompt: "Apply Nielsen's 10 usability heuristics to evaluate this user interface."
        assert:
          - type: contains_any
            value: ["visibility of system status", "consistency", "error prevention", "recognition"]
          - type: contains_any
            value: ["severity", "rating", "finding", "issue"]

  - name: "conducts user research"
    steps:
      - prompt: "How do I conduct user research for a new feature?"
        assert:
          - type: contains_any
            value: ["survey", "observation", "persona", "jobs to be done"]
          - type: contains
            value: "interview"

  - name: "creates personas"
    steps:
      - prompt: "How do I create user personas for my application?"
        assert:
          - type: contains_any
            value: ["goal", "pain point", "behavior", "research"]
          - type: contains_any
            value: ["segment", "scenario", "need", "fictional"]

  - name: "designs information architecture"
    steps:
      - prompt: "How do I design information architecture for a complex web application?"
        assert:
          - type: contains_any
            value: ["card sort", "hierarchy", "taxonomy", "labeling"]
          - type: contains
            value: "navigation"

  - name: "conducts usability testing"
    steps:
      - prompt: "How do I conduct usability testing for a mobile application?"
        assert:
          - type: contains_any
            value: ["moderated", "think aloud", "think-aloud", "task success", "participant"]
          - type: contains
            value: "task"
