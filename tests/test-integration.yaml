# Cross-Skill Integration Tests
#
# Tests skill interactions: orchestrator → specialist, review → security, etc.
# Run through a selected adapter configured outside this scenario file.

timeout: 300
skill: ./skills/arch-orchestrator

scenarios:
  - name: "orchestrator selects security for regulated system"
    steps:
      - prompt: 'For a patient records system handling regulated health data, return only a JSON mapping from skill names to booleans indicating whether each is needed: arch-security, arch-compliance, arch-data, arch-ai. No AI features are requested.'
        assert:
          - type: json_equals
            pointer: /arch-security
            value: true
          - type: json_equals
            pointer: /arch-compliance
            value: true
          - type: json_equals
            pointer: /arch-data
            value: true
          - type: json_equals
            pointer: /arch-ai
            value: false

  - name: "orchestrator skips irrelevant skills"
    steps:
      - prompt: 'For a simple employee-directory REST API with no events, AI or frontend, return only a JSON mapping of needed skills: arch-api, arch-ai, arch-event, arch-frontend.'
        assert:
          - type: json_equals
            pointer: /arch-api
            value: true
          - type: json_equals
            pointer: /arch-ai
            value: false
          - type: json_equals
            pointer: /arch-event
            value: false
          - type: json_equals
            pointer: /arch-frontend
            value: false

  - name: "review delegates to security"
    skill: ./skills/arch-review
    steps:
      - prompt: "Review this architecture: a public-facing payment API handling credit card data. Identify which specialist reviews are needed."
        assert:
          - type: contains
            value: "arch-security"
          - type: contains
            value: "arch-compliance"

  - name: "resolves security vs cost conflict"
    steps:
      - prompt: "The security review says data must stay on-premises. The cloud architect recommends a managed database for cost savings. How to resolve?"
        assert:
          - type: contains
            value: "priority"
          - type: contains
            value: "regulatory"
          - type: not_contains
            value: "ignore security"

  - name: "end-to-end greenfield design"
    runs: 2
    min_passes: 1
    steps:
      - prompt: "Design a greenfield order management platform for a retailer. Cloud, ~50k orders/day, PCI scope, needs API, needs monitoring. Produce a skill selection and execution plan."
        assert:
          - type: contains
            value: "arch-patterns"
          - type: contains
            value: "arch-security"
          - type: contains
            value: "arch-api"
          - type: contains
            value: "arch-observability"
          - type: contains
            value: "execution plan"
