timeout: 180
skill: ./skills/arch-metrics

scenarios:
  - name: "measures complexity"
    steps:
      - prompt: "How do I measure cyclomatic complexity and what thresholds should I use?"
        assert:
          - type: contains_any
            value: ["decision point", "branch", "McCabe", "paths"]
          - type: contains_any
            value: ["baseline", "trend", "context", "refactor"]

  - name: "analyzes dependencies"
    steps:
      - prompt: "How do I analyze module dependencies and detect cycles?"
        assert:
          - type: contains
            value: "dependency"
          - type: contains_any
            value: ["acyclic", "circular", "graph", "dependency-cruiser", "jdeps"]

  - name: "quantifies technical debt"
    steps:
      - prompt: "How do I quantify technical debt in a codebase?"
        assert:
          - type: contains_any
            value: ["remediation", "effort", "SQALE", "interest", "principal"]
          - type: contains
            value: "score"

  - name: "creates metrics dashboard"
    steps:
      - prompt: "What metrics should I track on an architecture health dashboard?"
        assert:
          - type: contains_any
            value: ["complexity", "coupling", "cycles", "coverage"]
          - type: contains_any
            value: ["trend", "baseline", "window", "owner"]

  - name: "calculates stability metrics"
    steps:
      - prompt: "How do I calculate stability and abstractness metrics for my modules?"
        assert:
          - type: contains_any
            value: ["efferent", "afferent", "Ce /", "zone of pain"]
          - type: contains
            value: "instability"
