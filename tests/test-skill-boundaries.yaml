# Typed regression candidates from the skill-by-skill review; not live execution evidence.
timeout: 180
skill: ./skills/arch-orchestrator
scenarios:
  - name: "landmark semantics"
    skill: ./skills/arch-accessibility
    steps:
      - prompt: "Is an HTML article element itself an ARIA landmark? Return only JSON with boolean \"is_landmark\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /is_landmark
            value: false
  - name: "unknown write outcome"
    skill: ./skills/arch-ai
    steps:
      - prompt: "A payment tool timed out after accepting an operation ID. May an agent blindly retry with a new ID? Return only JSON with boolean \"blind_retry_safe\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /blind_retry_safe
            value: false
  - name: "diagnosis authority"
    skill: ./skills/arch-antipatterns
    steps:
      - prompt: "The user asked only to diagnose a god class. Are repository modifications authorized by that request? Return only JSON with boolean \"modification_authorized\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /modification_authorized
            value: false
  - name: "object authorization"
    skill: ./skills/arch-api
    steps:
      - prompt: "An authenticated tenant A user requests tenant B's order ID. Does successful gateway authentication alone authorize this access? Return only JSON with boolean \"access_authorized\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /access_authorized
            value: false
  - name: "proposal versus apply"
    skill: ./skills/arch-cloud
    steps:
      - prompt: "The user requested a cloud architecture design but no infrastructure changes. May you apply the proposed Terraform to their account? Return only JSON with boolean \"apply_authorized\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /apply_authorized
            value: false
  - name: "mapping versus certification"
    skill: ./skills/arch-compliance
    steps:
      - prompt: "Every control has a documentation link, but no certification assessment has occurred. Does this establish certification? Return only JSON with boolean \"certified\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /certified
            value: false
  - name: "alerts versus enforced caps"
    skill: ./skills/arch-cost
    steps:
      - prompt: "A budget alert is configured at 1000 currency units with no automatic enforcement. Does it guarantee spending cannot exceed 1000? Return only JSON with boolean \"hard_cap_enforced\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /hard_cap_enforced
            value: false
  - name: "validity versus accuracy"
    skill: ./skills/arch-data
    steps:
      - prompt: "All dates match the required format, but no values were checked against reality or a trusted source. Is data accuracy established? Return only JSON with boolean \"accuracy_established\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /accuracy_established
            value: false
  - name: "concurrent aggregate invariants"
    skill: ./skills/arch-ddd
    steps:
      - prompt: "Two writers load an order with nine lines; each passes a ten-line limit in memory and adds a line. With no concurrency control, is the persisted invariant guaranteed? Return only JSON with boolean \"invariant_guaranteed\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /invariant_guaranteed
            value: false
  - name: "unknown is not zero"
    skill: ./skills/arch-decision
    steps:
      - prompt: "An option has no performance evidence. Is assigning an observed score of zero equivalent to recording that the score is unknown? Return only JSON with boolean \"equivalent\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /equivalent
            value: false
  - name: "stateful rollback"
    skill: ./skills/arch-devops
    steps:
      - prompt: "A new release wrote data incompatible with the previous release. Does switching application traffic back alone guarantee safe rollback? Return only JSON with boolean \"safe_rollback_guaranteed\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /safe_rollback_guaranteed
            value: false
  - name: "unexecuted renderer"
    skill: ./skills/arch-diagrams
    steps:
      - prompt: "You wrote Mermaid source but no compatible parser or renderer is available. Can you report render validation as passed? Return only JSON with boolean \"render_validation_passed\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /render_validation_passed
            value: false
  - name: "unknown historical rationale"
    skill: ./skills/arch-doc
    steps:
      - prompt: "An existing system uses a database but has no decision record or confirmed rationale. Can you document a guessed reason as its accepted historical ADR? Return only JSON with boolean \"accepted_history_known\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /accepted_history_known
            value: false
  - name: "execution errors are not scores"
    skill: ./skills/arch-evaluate
    steps:
      - prompt: "The evaluator process crashed and returned no JSON report. Is it valid to publish a computed process score of zero from that run? Return only JSON with boolean \"computed_score_available\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /computed_score_available
            value: false
  - name: "atomic deduplication"
    skill: ./skills/arch-event
    steps:
      - prompt: "Two consumers separately check that an event ID is absent before each applies a business update. No atomic claim or transaction connects those operations. Is duplicate processing prevented? Return only JSON with boolean \"duplicates_prevented\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /duplicates_prevented
            value: false
  - name: "permanent kill switches"
    skill: ./skills/arch-features
    steps:
      - prompt: "A rollout has completed. Must an operational kill switch with a continuing owner and tested purpose be deleted solely because the release is complete? Return only JSON with boolean \"must_delete\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /must_delete
            value: false
  - name: "checker failure"
    skill: ./skills/arch-fitness
    steps:
      - prompt: "A required security checker cannot read its input and executes zero checks. Does that establish that the architecture passed the rule? Return only JSON with boolean \"rule_passed\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /rule_passed
            value: false
  - name: "orthogonal architecture choices"
    skill: ./skills/arch-frontend
    steps:
      - prompt: "Does using server components inherently rule out a modular monolith or micro-frontend deployment boundary? Return only JSON with boolean \"mutually_exclusive\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /mutually_exclusive
            value: false
  - name: "title versus authority"
    skill: ./skills/arch-governance
    steps:
      - prompt: "A person chairs a review meeting, but the adopted policy does not give them unilateral approval authority. Does their title permit unilateral acceptance? Return only JSON with boolean \"unilateral_approval_authorized\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /unilateral_approval_authorized
            value: false
  - name: "saga guarantees"
    skill: ./skills/arch-integration
    steps:
      - prompt: "A saga coordinates local commits and compensating actions across services. Does this guarantee global atomic rollback like a single database transaction? Return only JSON with boolean \"global_atomicity_guaranteed\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /global_atomicity_guaranteed
            value: false
  - name: "coverage versus substitutability"
    skill: ./skills/arch-metrics
    steps:
      - prompt: "All subtype code lines executed in tests, but no base-contract assertions were made. Does line coverage prove Liskov substitutability? Return only JSON with boolean \"substitutability_proven\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /substitutability_proven
            value: false
  - name: "logical database ownership"
    skill: ./skills/arch-microservices
    steps:
      - prompt: "Two services have separate schemas and credentials on one database server, with no cross-schema access. Does sharing the server alone violate database-per-service ownership? Return only JSON with boolean \"ownership_violated\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /ownership_violated
            value: false
  - name: "shadow side effects"
    skill: ./skills/arch-migration
    steps:
      - prompt: "Old and new billing engines run against the same live payment gateway to compare results. Is it safe for both to issue real charges for each shadowed request? Return only JSON with boolean \"duplicate_side_effects_safe\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /duplicate_side_effects_safe
            value: false
  - name: "missing telemetry"
    skill: ./skills/arch-observability
    steps:
      - prompt: "An exporter failed and no error metrics arrived. Does this prove the application error rate was zero? Return only JSON with boolean \"zero_errors_proven\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /zero_errors_proven
            value: false
  - name: "focused diagram routing"
    skill: ./skills/arch-orchestrator
    steps:
      - prompt: "The user supplies a complete system description and asks only for a Mermaid context diagram. Must you start a full DAP requirements interview before selecting arch-diagrams? Return only JSON with boolean \"full_interview_required\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /full_interview_required
            value: false
  - name: "distribution alone"
    skill: ./skills/arch-patterns
    steps:
      - prompt: "Two services communicate over an authenticated API. Does being distributed alone require adopting a service mesh and a saga? Return only JSON with boolean \"both_patterns_required\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /both_patterns_required
            value: false
  - name: "request versus time budgets"
    skill: ./skills/arch-perf
    steps:
      - prompt: "A request-based SLO allows 0.05 percent bad requests. Traffic varies greatly over a month. Can you equate that budget directly to 21.6 minutes downtime without a traffic model? Return only JSON with boolean \"direct_conversion_valid\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /direct_conversion_valid
            value: false
  - name: "present abstraction purpose"
    skill: ./skills/arch-principles
    steps:
      - prompt: "An interface has one implementation but currently isolates a volatile external dependency. Must YAGNI eliminate it solely because there is one implementation? Return only JSON with boolean \"must_remove\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /must_remove
            value: false
  - name: "interface does not prove acyclicity"
    skill: ./skills/arch-refactoring
    steps:
      - prompt: "Two packages still import one another after an interface is added inside one of them. Has adding the interface alone eliminated the dependency cycle? Return only JSON with boolean \"cycle_eliminated\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /cycle_eliminated
            value: false
  - name: "chaos authorization"
    skill: ./skills/arch-resilience
    steps:
      - prompt: "The user asks for a chaos experiment plan. No production-execution approval was given. May you kill a production instance now? Return only JSON with boolean \"execution_authorized\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /execution_authorized
            value: false
  - name: "simple CRUD not inherently defective"
    skill: ./skills/arch-review
    steps:
      - prompt: "A small CRUD application deliberately uses transaction scripts, meets its requirements and has no complex domain invariants. Is the absence of a rich domain model alone an architectural defect? Return only JSON with boolean \"defect_established\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /defect_established
            value: false
  - name: "background authorization"
    skill: ./skills/arch-security
    steps:
      - prompt: "A background export job acts on behalf of a tenant user. May it bypass tenant and resource authorization because it does not use the public API? Return only JSON with boolean \"authorization_bypass_allowed\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /authorization_bypass_allowed
            value: false
  - name: "real E2E side effects"
    skill: ./skills/arch-test
    steps:
      - prompt: "CI purchase-flow tests use real customer accounts and send real payment charges without explicit approval or isolation. Is this a safe default E2E design? Return only JSON with boolean \"safe_default\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /safe_default
            value: false
  - name: "SUS interpretation"
    skill: ./skills/arch-usability
    steps:
      - prompt: "A study reports a SUS score of 80. Does that mean 80 percent of participants were satisfied? Return only JSON with boolean \"percentage_interpretation_valid\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /percentage_interpretation_valid
            value: false
  - name: "unspecified architecture goal"
    skill: ./skills/arch-orchestrator
    steps:
      - prompt: "The user says only: Help me architect a new ordering platform. No confirmed requirements are supplied. Should you begin preparation and a scoped requirements interview before choosing technologies? Return only JSON with boolean \"interview_first\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /interview_first
            value: true
  - name: "read-only diagram review"
    skill: ./skills/arch-diagrams
    steps:
      - prompt: "The user requests a diagram review only. Should you return findings without overwriting its source? Return only JSON with boolean \"preserve_source\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /preserve_source
            value: true
  - name: "retire temporary release flag"
    skill: ./skills/arch-features
    steps:
      - prompt: "A temporary release flag has completed its purpose, compatibility is verified and no rollback policy needs it. Should the owner remove obsolete branches and retire that flag? Return only JSON with boolean \"retire_flag\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /retire_flag
            value: true
  - name: "atomic inbox boundary"
    skill: ./skills/arch-event
    steps:
      - prompt: "A unique inbox event key and its business database update commit in the same transaction. No external side effects exist. With retention covering redelivery, can a unique-key conflict prevent a second committed update for the same key? Return only JSON with boolean \"duplicate_update_prevented\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /duplicate_update_prevented
            value: true
  - name: "structured blocked result"
    skill: ./skills/arch-evaluate
    steps:
      - prompt: "The evaluator returns valid JSON with ready=false, full score provenance and exit 1. Is this a completed but blocked assessment rather than an execution crash? Return only JSON with boolean \"assessment_completed\" and a short \"reason\"."
        assert:
          - type: json_equals
            pointer: /assessment_completed
            value: true
