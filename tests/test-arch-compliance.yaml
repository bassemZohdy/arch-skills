timeout: 180
skill: ./skills/arch-compliance

scenarios:
  - name: "reviews GDPR compliance"
    steps:
      - prompt: "Review this system for GDPR compliance. What data processing activities need documentation?"
        assert:
          - type: contains_any
            value: ["Article 30", "records of processing", "lawful basis", "legal basis"]
          - type: contains_any
            value: ["DPIA", "data subject", "retention", "processor"]

  - name: "designs audit trail"
    steps:
      - prompt: "Design an audit trail for a financial transaction system."
        assert:
          - type: contains_any
            value: ["immutable", "tamper", "append-only", "integrity"]
          - type: contains
            value: "log"

  - name: "implements data retention"
    steps:
      - prompt: "How should I implement data retention policies for GDPR compliance?"
        assert:
          - type: contains_any
            value: ["storage limitation", "deletion", "erasure", "purpose"]
          - type: contains
            value: "policy"

  - name: "creates privacy policy"
    steps:
      - prompt: "What should a GDPR-compliant privacy policy include?"
        assert:
          - type: contains_any
            value: ["legal basis", "lawful basis", "data subject", "controller"]
          - type: contains
            value: "consent"

  - name: "reviews SOC 2 controls"
    steps:
      - prompt: "What SOC 2 controls should be in place for a SaaS application?"
        assert:
          - type: contains_any
            value: ["trust service", "trust services", "Type II", "Type 2"]
          - type: contains_any
            value: ["evidence", "auditor", "change management", "access review"]
