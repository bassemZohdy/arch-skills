timeout: 180
skill: ./skills/arch-devops

scenarios:
  - name: "writes Terraform module"
    steps:
      - prompt: "Write a Terraform module for provisioning an AWS VPC with public and private subnets."
        assert:
          - type: contains
            value: "resource"
          - type: contains
            value: "aws_vpc"
          - type: capability_used
            value: "file_write"
          - type: not_contains
            value: "hardcode credentials"

  - name: "creates Kubernetes manifest"
    steps:
      - prompt: "Create a Kubernetes deployment manifest for a Node.js application with 3 replicas."
        assert:
          - type: contains
            value: "Deployment"
          - type: contains
            value: "replicas"
          - type: not_contains
            value: "latest"

  - name: "configures CI/CD pipeline"
    runs: 3
    min_passes: 2
    steps:
      - prompt: "Configure a GitHub Actions CI/CD pipeline for a Python application with testing and deployment."
        assert:
          - type: contains
            value: "on:"
          - type: contains
            value: "jobs"

  - name: "implements GitOps workflow"
    steps:
      - prompt: "How do I implement a GitOps workflow with Flux for Kubernetes?"
        assert:
          - type: contains
            value: "GitOps"
          - type: contains
            value: "Flux"

  - name: "creates Ansible playbook"
    steps:
      - prompt: "Create an Ansible playbook to configure a web server with Nginx and SSL."
        assert:
          - type: contains
            value: "hosts:"
          - type: contains
            value: "tasks:"
  - name: "designs blue-green deployment"
    steps:
      - prompt: "Design a blue-green deployment strategy for a critical production system."
        assert:
          - type: contains
            value: "blue-green"
          - type: contains
            value: "zero-downtime"

  - name: "implements canary release"
    steps:
      - prompt: "How do I implement a canary release strategy for gradual rollout?"
        assert:
          - type: contains
            value: "canary"
          - type: contains
            value: "percentage"

  - name: "creates rollback plan"
    steps:
      - prompt: "Create a rollback plan for a deployment that introduces a critical bug."
        assert:
          - type: contains
            value: "rollback"
          - type: contains
            value: "plan"

  - name: "sets up GitOps"
    steps:
      - prompt: "How do I set up GitOps with ArgoCD for Kubernetes deployments?"
        assert:
          - type: contains
            value: "GitOps"
          - type: contains
            value: "ArgoCD"

  - name: "defines DORA metrics"
    steps:
      - prompt: "What are DORA metrics and how do I measure deployment performance?"
        assert:
          - type: contains
            value: "DORA"
          - type: contains
            value: "deployment frequency"
