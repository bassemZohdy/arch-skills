timeout: 180
skill: ./skills/arch-orchestrator

scenarios:
  - name: "prepares and starts the interview on an initial request"
    steps:
      - prompt: "Interview me for a customer order platform."
        assert:
          - type: contains
            value: "preparation"
          - type: contains
            value: "interview"
          - type: contains
            value: "question"
          - type: contains
            value: "requirements"

  - name: "batches related answers before reconciliation without format instructions"
    steps:
      - prompt: "We need a customer order platform."
        assert:
          - type: contains
            value: "recommended"
          - type: contains
            value: "industry"
          - type: contains
            value: "custom answer"
          - type: contains
            value: "one question"
          - type: contains
            value: "batch"
          - type: contains
            value: "reconciliation"

  - name: "selects minimal skill set instead of all skills"
    steps:
      - prompt: "Design a small internal REST API for employee directory lookup. No events, no AI, no frontend, low traffic. Which specialist skills do you select?"
        assert:
          - type: contains
            value: "arch-api"
          - type: contains
            value: "minimum"

  - name: "routes a diagram-first request to the diagram specialist"
    steps:
      - prompt: "The primary deliverable is a Mermaid deployment diagram for an existing order platform. Which specialist should own the diagram source and cross-view validation?"
        assert:
          - type: contains
            value: "arch-diagrams"
          - type: contains
            value: "diagram"

  - name: "classifies the request before selecting technology"
    steps:
      - prompt: "We want to modernize our on-prem order monolith to the cloud. Start the analysis."
        assert:
          - type: contains
            value: "modernization"
          - type: contains
            value: "classification"

  - name: "resolves conflicts by explicit priority order"
    steps:
      - prompt: "The security skill says all data must stay on-premises for compliance, but the cost skill recommends a managed cloud database. How do you resolve this?"
        assert:
          - type: contains
            value: "regulatory"
          - type: contains
            value: "priority"

  - name: "rejects overengineering without requirements"
    steps:
      - prompt: "Should we add Kafka, a service mesh, and an API gateway to our 3-person team's internal tool with 50 users?"
        assert:
          - type: contains
            value: "requirement"
          - type: contains
            value: "simplest"

  - name: "does not pretend skills executed when dynamic invocation is unsupported"
    steps:
      - prompt: "You cannot actually invoke other skills in this conversation. Design an architecture for a patient records system and tell me which skills should be applied."
        assert:
          - type: contains
            value: "execution plan"
          - type: contains
            value: "not"
