timeout: 180
skill: ./skills/arch-features

scenarios:
  - name: "creates feature flag"
    steps:
      - prompt: "Create a feature flag for a new checkout experience with 10% rollout."
        assert:
          - type: contains_any
            value: ["percentage", "bucket", "hash", "stable"]
          - type: contains_any
            value: ["kill switch", "rollback", "default", "owner", "cleanup"]

  - name: "implements A/B testing"
    steps:
      - prompt: "How do I implement A/B testing for a new user interface?"
        assert:
          - type: contains_any
            value: ["control", "treatment", "hypothesis", "sample size"]
          - type: contains
            value: "variant"

  - name: "designs rollout strategy"
    steps:
      - prompt: "Design a gradual rollout strategy for a new payment feature."
        assert:
          - type: contains_any
            value: ["canary", "ring", "percentage", "internal"]
          - type: contains_any
            value: ["guardrail", "metric", "rollback", "kill switch"]

  - name: "manages feature lifecycle"
    steps:
      - prompt: "How do I manage the lifecycle of a feature flag from creation to cleanup?"
        assert:
          - type: contains_any
            value: ["owner", "expiry", "expiration", "review date"]
          - type: contains_any
            value: ["remove", "retire", "stale", "debt"]

  - name: "implements feature toggle"
    steps:
      - prompt: "Implement a feature toggle that can be controlled via API."
        assert:
          - type: contains_any
            value: ["endpoint", "PATCH", "PUT", "POST"]
          - type: contains_any
            value: ["authoriz", "audit", "cache", "propagat"]
