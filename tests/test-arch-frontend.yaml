timeout: 180
skill: ./skills/arch-frontend

scenarios:
  - name: "designs micro frontends"
    steps:
      - prompt: "Design a micro frontends architecture for a large e-commerce platform."
        assert:
          - type: contains_any
            value: ["Module Federation", "shell", "composition", "team"]
          - type: contains
            value: "independent"

  - name: "implements state management"
    steps:
      - prompt: "What state management pattern should I use for a complex React application?"
        assert:
          - type: contains_any
            value: ["server state", "query cache", "React Query", "TanStack"]
          - type: contains_any
            value: ["Redux", "Zustand", "Context", "Jotai"]

  - name: "creates component library"
    steps:
      - prompt: "How do I create a shared component library for multiple frontend applications?"
        assert:
          - type: contains_any
            value: ["design system", "Storybook", "tokens"]
          - type: contains_any
            value: ["versioning", "semver", "package", "monorepo"]

  - name: "optimizes performance"
    steps:
      - prompt: "How do I optimize frontend performance for a React application?"
        assert:
          - type: contains_any
            value: ["code splitting", "lazy", "bundle", "memo", "Core Web Vitals"]
          - type: contains
            value: "optimization"

  - name: "implements lazy loading"
    steps:
      - prompt: "How do I implement lazy loading for routes in a React application?"
        assert:
          - type: contains_any
            value: ["React.lazy", "Suspense", "dynamic import", "import("]
          - type: contains_any
            value: ["chunk", "code splitting", "fallback", "bundle"]
