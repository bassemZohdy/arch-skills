timeout: 180
skill: ./skills/arch-ai

scenarios:
  - name: "designs RAG pipeline"
    steps:
      - prompt: "Design a RAG pipeline for answering questions over our internal documentation."
        assert:
          - type: contains
            value: "chunk"
          - type: contains
            value: "embedding"
          - type: contains
            value: "retriev"

  - name: "recommends against unnecessary agents"
    steps:
      - prompt: "I want to build a multi-agent system to classify support tickets into 5 categories. What architecture do you recommend?"
        assert:
          - type: contains
            value: "direct prompting"

  - name: "addresses prompt injection"
    steps:
      - prompt: "What guardrails do I need for an LLM agent that can read user-uploaded documents and call internal APIs?"
        assert:
          - type: contains
            value: "prompt injection"
          - type: contains
            value: "permission"

  - name: "designs evaluation strategy"
    steps:
      - prompt: "How should I evaluate the quality of my LLM-powered summarization feature before and after deployment?"
        assert:
          - type: contains_any
            value: ["regression", "LLM-as-judge", "human review", "rubric"]
          - type: contains
            value: "golden"

  - name: "optimizes inference cost"
    steps:
      - prompt: "Our LLM API bill is too high. What architectural levers can reduce inference cost?"
        assert:
          - type: contains
            value: "cach"
          - type: contains
            value: "model"

  - name: "secures stateless MCP tools and agent delegation"
    steps:
      - prompt: "Our agent calls internal tools over MCP and delegates research to a partner agent over A2A. How should identity, authorization and injected instructions be handled?"
        assert:
          - type: contains_any
            value: ["each request", "every request", "per request", "per-request", "stateless"]
          - type: contains_any
            value: ["least privilege", "least-privilege", "scoped", "approval"]
          - type: contains_any
            value: ["untrusted", "as data", "not instructions", "privileged action"]
          - type: contains_any
            value: ["verify", "authenticat", "signed"]
